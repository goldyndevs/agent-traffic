name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install lsof (port owner lookup)
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Syntax check
        shell: bash
        run: for f in bin/*.js core/*.js guards/*.js hooks/*.js; do node --check "$f"; done
      - name: Test suite
        shell: bash
        run: bash test/run-tests.sh
