<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Without and with agent-traffic</title>
  <desc id="d">Without it, parallel agents run two Gradle builds, three duplicate dev servers and an install mid-build, and stash each other's work. With it, builds queue, the server is reused, the install waits and the stash is blocked.</desc>
  <style>
    .ink{fill:#1f2328}.muted{fill:#59636e}
    .card{fill:#ffffff;stroke:#d1d9e0}
    .hotcard{fill:#fff5f5;stroke:#ff8182}.coolcard{fill:#f2fbf5;stroke:#4ac26b}
    .screen{fill:#24292f}.base{fill:#8c959f}
    .barbg{fill:#3d444d}.hot{fill:#cf222e}.warm{fill:#d29922}.ok{fill:#2da44e}
    .scr{fill:#e6edf3}
    .bad{fill:#ffebe9;stroke:#ff8182}.wait{fill:#fff8c5;stroke:#d4a72c}.good{fill:#dafbe1;stroke:#4ac26b}.info{fill:#ddf4ff;stroke:#54aeff}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){
      .ink{fill:#e6edf3}.muted{fill:#9198a1}
      .card{fill:#161b22;stroke:#3d444d}.hotcard{fill:#1f1214;stroke:#da3633}.coolcard{fill:#0f1d14;stroke:#2ea043}
      .screen{fill:#010409}.base{fill:#3d444d}
      .bad{fill:#4c1014;stroke:#da3633}.wait{fill:#3b2e00;stroke:#9e6a03}.good{fill:#0f2c1a;stroke:#2ea043}.info{fill:#0c2d6b;stroke:#1f6feb}
    }
  </style>

  <!-- ============ WITHOUT ============ -->
  <rect x="10" y="10" width="580" height="450" rx="18" class="hotcard" stroke-width="2"/>
  <text x="40" y="58" class="ink" font-size="28" font-weight="800">😵 Without agent-traffic</text>
  <text x="40" y="88" class="muted" font-size="16">Three agents, one laptop, zero coordination.</text>

  <!-- hot laptop -->
  <g transform="translate(40 112)">
    <rect width="200" height="128" rx="10" class="screen"/>
    <text x="16" y="30" class="scr mono" font-size="14">CPU</text>
    <rect x="62" y="18" width="122" height="14" rx="7" class="barbg"/><rect x="62" y="18" width="122" height="14" rx="7" class="hot"/>
    <text x="16" y="60" class="scr mono" font-size="14">RAM</text>
    <rect x="62" y="48" width="122" height="14" rx="7" class="barbg"/><rect x="62" y="48" width="118" height="14" rx="7" class="hot"/>
    <text x="16" y="96" class="scr mono" font-size="14">fans:</text>
    <text x="70" y="98" font-size="22">🔥🔥🔥</text>
    <rect x="-16" y="128" width="232" height="14" rx="7" class="base"/>
  </g>
  <text x="40" y="290" class="ink" font-size="15" font-weight="600">mouse cursor: also frozen 🥶</text>

  <!-- chaos list -->
  <g transform="translate(280 112)" font-size="14">
    <rect width="286" height="40" rx="9" class="bad" stroke-width="1.5"/>
    <text x="12" y="25" class="ink mono">gradle assembleDebug ×2 🔥</text>
    <rect y="50" width="286" height="40" rx="9" class="bad" stroke-width="1.5"/>
    <text x="12" y="75" class="ink mono">vite :5173 :5174 :5175 👯👯</text>
    <rect y="100" width="286" height="40" rx="9" class="bad" stroke-width="1.5"/>
    <text x="12" y="125" class="ink mono">npm i (mid-build) 💥 ENOENT</text>
    <rect y="150" width="286" height="40" rx="9" class="bad" stroke-width="1.5"/>
    <text x="12" y="175" class="ink mono">git stash (not yours) 🫥</text>
    <rect y="200" width="286" height="40" rx="9" class="bad" stroke-width="1.5"/>
    <text x="12" y="225" class="ink mono">npm run dev ⌛ 10 min timeout</text>
  </g>

  <!-- speech bubble -->
  <g transform="translate(40 366)">
    <rect width="526" height="78" rx="16" class="card" stroke-width="1.5"/>
    <text x="22" y="33" class="ink" font-size="18" font-weight="700">“Who stashed my changes?!”</text>
    <text x="22" y="60" class="muted" font-size="15">Agent B, 4 minutes later, staring at an empty diff</text>
  </g>

  <!-- ============ WITH ============ -->
  <rect x="610" y="10" width="580" height="450" rx="18" class="coolcard" stroke-width="2"/>
  <text x="640" y="58" class="ink" font-size="28" font-weight="800">😎 With agent-traffic</text>
  <text x="640" y="88" class="muted" font-size="16">Same three agents. They just take turns.</text>

  <!-- calm laptop -->
  <g transform="translate(640 112)">
    <rect width="200" height="128" rx="10" class="screen"/>
    <text x="16" y="30" class="scr mono" font-size="14">CPU</text>
    <rect x="62" y="18" width="122" height="14" rx="7" class="barbg"/><rect x="62" y="18" width="70" height="14" rx="7" class="warm"/>
    <text x="16" y="60" class="scr mono" font-size="14">RAM</text>
    <rect x="62" y="48" width="122" height="14" rx="7" class="barbg"/><rect x="62" y="48" width="64" height="14" rx="7" class="ok"/>
    <text x="16" y="96" class="scr mono" font-size="14">fans:</text>
    <text x="70" y="98" font-size="22">🍃</text>
    <rect x="-16" y="128" width="232" height="14" rx="7" class="base"/>
  </g>
  <text x="640" y="290" class="ink" font-size="15" font-weight="600">you can still use Slack 🎉</text>

  <!-- calm list -->
  <g transform="translate(880 112)" font-size="14">
    <rect width="286" height="40" rx="9" class="good" stroke-width="1.5"/>
    <text x="12" y="25" class="ink mono">gradle ▶ running</text>
    <rect y="50" width="286" height="40" rx="9" class="wait" stroke-width="1.5"/>
    <text x="12" y="75" class="ink mono">gradle ⏳ queued #1 (bg)</text>
    <rect y="100" width="286" height="40" rx="9" class="info" stroke-width="1.5"/>
    <text x="12" y="125" class="ink mono">reuse localhost:5173 ♻️</text>
    <rect y="150" width="286" height="40" rx="9" class="wait" stroke-width="1.5"/>
    <text x="12" y="175" class="ink mono">npm i waits for build ✋</text>
    <rect y="200" width="286" height="40" rx="9" class="info" stroke-width="1.5"/>
    <text x="12" y="225" class="ink mono">stash blocked → worktree 🌳</text>
  </g>

  <g transform="translate(640 366)">
    <rect width="526" height="78" rx="16" class="card" stroke-width="1.5"/>
    <text x="22" y="33" class="ink" font-size="18" font-weight="700">“Server already running, I'll reuse it.”</text>
    <text x="22" y="60" class="muted" font-size="15">Agent B, actually reading the message it was given</text>
  </g>
</svg>
